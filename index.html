<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Note</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        :root { --death-red: #ff1a1a; --death-black: #000; }
        body { margin: 0; padding: 0; font-family: "궁서", serif; background: #000; color: var(--death-red); overflow-x: hidden; }

        /* 커튼 레이어 - 처음에 화면을 가리고 있음 */
        #curtain-left, #curtain-right {
            position: fixed; top: 0; width: 50%; height: 100%; background: #000;
            z-index: 10000; transition: transform 1.5s cubic-bezier(0.7, 0, 0.3, 1);
            border: 1px solid #1a1a1a; pointer-events: none; /* 클릭 방해 금지 */
        }
        #curtain-left { left: 0; } #curtain-right { right: 0; }
        body.open #curtain-left { transform: translateX(-100%); }
        body.open #curtain-right { transform: translateX(100%); }

        /* 룰 화면 (오버레이) */
        #rulesOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        #rulesContent {
            max-width: 400px; text-align: left; margin: 20px; line-height: 1.6;
            border: 1px solid #333; padding: 20px; font-size: 0.9rem;
        }

        /* 메인 화면 */
        #deathNote { display: none; opacity: 0; transition: opacity 1s; padding: 20px; }
        body.visible #deathNote { display: block; opacity: 1; }

        .main-wrapper { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        h1 { font-family: 'Creepster', cursive; font-size: 3.5rem; text-shadow: 0 0 15px var(--death-red); margin: 10px 0; }

        /* 미니 룰 박스 */
        .mini-rules { border: 1px solid var(--death-red); padding: 10px; font-size: 0.8rem; text-align: left; align-self: flex-end; max-width: 250px; background: rgba(20,0,0,0.8); }

        /* 입력 및 리스트 레이아웃 (PC) */
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; text-align: left; }
        .input-box { display: flex; flex-direction: column; gap: 10px; }
        input, button { padding: 12px; background: #000; border: 1px solid var(--death-red); color: var(--death-red); font-size: 1rem; }
        button { cursor: pointer; font-family: 'Creepster'; font-size: 1.2rem; }

        /* 사망 문구 */
        .death-list li { list-style: none; padding: 15px; border: 1px solid var(--death-red); margin-bottom: 10px; background: #050000; }
        .death-msg { color: #ff0000; font-weight: bold; text-decoration: underline; display: block; margin-top: 10px; font-size: 1.1rem; }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
            h1 { font-size: 2.5rem; }
            .mini-rules { align-self: center; }
        }

        /* 상단 네비 */
        .nav { position: absolute; top: 10px; right: 10px; z-index: 10001; }
        select { background: #000; color: var(--death-red); border: 1px solid var(--death-red); padding: 5px; }
    </style>
</head>
<body>
    <div id="curtain-left"></div><div id="curtain-right"></div>

    <div class="nav">
        <select id="langSelect">
            <option value="ko">KOREAN</option>
            <option value="en">ENGLISH</option>
            <option value="jp">日本語</option>
            <option value="ru">Русский</option>
            <option value="cn">中文</option>
        </select>
    </div>

    <div id="rulesOverlay">
        <h1 style="font-size: 3rem;">RULES</h1>
        <div id="rulesContent"></div>
        <button id="agreeBtn">AGREE</button>
    </div>

    <div id="deathNote">
        <div class="main-wrapper">
            <h1>Death Note</h1>
            <div class="mini-rules" id="miniRules"></div>
            <div class="content-grid">
                <div class="input-box">
                    <input type="text" id="name"><input type="text" id="year"><input type="text" id="time"><input type="text" id="reason">
                    <button id="recordBtn">RECORD</button>
                </div>
                <div class="list-box">
                    <h2 style="font-family: 'Creepster';">DEATH LIST</h2>
                    <div id="listContainer" class="death-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const trans = {
            ko: { rules: ["1. 정보를 정확히 입력하십시오.", "2. 새 기록 시 이전 명단은 삭제됩니다.", "3. 사인은 붉은 글씨로 표시됩니다."], placeholders: ["이름", "날짜", "시간", "사인"], alert: (n, r) => `${n}은(는) 사망했다. (사인: ${r})`, agree: "동의" },
            en: { rules: ["1. Enter info accurately.", "2. New entry clears old record.", "3. Death cause is in red."], placeholders: ["Name", "Date", "Time", "Reason"], alert: (n, r) => `${n} has died. (Cause: ${r})`, agree: "AGREE" },
            jp: { rules: ["1. 正確に入力してください。", "2. 新しい名前で前のは消えます。", "3. 死因は赤文字で表示されます。"], placeholders: ["名前", "日付", "時間", "死因"], alert: (n, r) => `${n}は死亡した。(死因: ${r})`, agree: "同意" },
            ru: { rules: ["1. Введите данные точно.", "2. Старая запись удаляется.", "3. Причина смерти - красным."], placeholders: ["Имя", "Дата", "Время", "Причина"], alert: (n, r) => `${n} умер. (Причина: ${r})`, agree: "Да" },
            cn: { rules: ["1. 请准确输入信息。", "2. 新记录清除旧记录。", "3. 死因以红色显示。"], placeholders: ["姓名", "日期", "时间", "死因"], alert: (n, r) => `${n}已死亡。(死因: ${r})`, agree: "同意" }
        };

        let lang = "ko";
        function update() {
            const t = trans[lang];
            document.getElementById("rulesContent").innerHTML = t.rules.map(r => `<p>${r}</p>`).join("");
            document.getElementById("miniRules").innerHTML = t.rules.map(r => `<div>${r}</div>`).join("");
            document.getElementById("agreeBtn").textContent = t.agree;
            ["name", "year", "time", "reason"].forEach((id, i) => document.getElementById(id).placeholder = t.placeholders[i]);
        }

        document.getElementById("langSelect").addEventListener("change", (e) => { lang = e.target.value; update(); });

        document.getElementById("agreeBtn").addEventListener("click", () => {
            document.body.classList.add("open");
            setTimeout(() => { document.getElementById("rulesOverlay").style.display = "none"; document.body.classList.add("visible"); }, 1500);
        });

        document.getElementById("recordBtn").addEventListener("click", () => {
            const n = document.getElementById("name").value, y = document.getElementById("year").value, t = document.getElementById("time").value, r = document.getElementById("reason").value;
            if(!n || !y || !t || !r) return alert("Fill all!");
            document.getElementById("listContainer").innerHTML = `<li><div>DATE: ${y} / TIME: ${t}</div><div style="font-size: 1.2rem; margin: 5px 0;">TARGET: ${n}</div><span class="death-msg">${trans[lang].alert(n, r)}</span></li>`;
            ["name", "year", "time", "reason"].forEach(id => document.getElementById(id).value = "");
        });

        update();
    </script>
</body>
</html>
