<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Death Note</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "궁서", serif;
    background: radial-gradient(circle, #111 0%, #000 100%);
    color: #ff1a1a;
    text-align: center;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
}

#mainWrapper {
    width: 100%;
    max-width: 1200px;
    transition: width 0.5s ease;
    padding: 20px;
}

/* 룰 화면 */
#rulesOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 9999;
    display: flex;
}
.curtain {
    width: 50%; height: 100%;
    background: black;
    transition: transform 1s ease-in-out;
}

.rules-inner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
    width: 90%;
    max-width: 600px;
}

/* 선택 박스만 우측 상단으로 */
.select-group { 
    position: absolute;
    top: -40px;
    right: 0;
    display: flex; 
    gap: 10px; 
}
select, .btn-style {
    background: black; color: red; border: 1px solid red;
    padding: 8px 12px; font-family: 'Creepster', "궁서";
    cursor: pointer; font-size: 14px;
}

#rulesContent {
    height: 250px;
    overflow-y: auto;
    text-align: left;
    line-height: 1.8em;
    border: 1px solid #444;
    padding: 25px;
    background: rgba(0,0,0,0.9);
    font-size: 15px;
    scrollbar-width: thin;
    scrollbar-color: red black;
}

/* 메인 화면 제목 및 밑줄 */
.title-section { width: 100%; margin-bottom: 80px; position: relative; }
.title-section h1 { font-size: 4.5rem; margin: 0; font-family: 'Creepster'; }
.title-underline {
    width: 100vw; height: 5px; background-color: #ff1a1a;
    position: absolute; left: 50%; transform: translateX(-50%);
    margin-top: 20px;
}

/* 입력 영역 */
.input-row { 
    display: flex; align-items: center; justify-content: center; 
    gap: 10px; width: 90%; max-width: 500px; margin: 0 auto 15px;
}
.input-row label { font-weight: bold; min-width: 50px; text-align: right; }
input { 
    flex: 1; padding: 12px; background: black; border: 1px solid red; 
    color: red; font-size: 16px;
}

/* 리스트 스타일 */
#listContainer {
    height: 350px; overflow-y: auto; width: 100%; max-width: 800px;
    margin: 30px auto; border: 2px solid #ff1a1a;
    background: rgba(10, 0, 0, 0.8);
}
li { 
    padding: 15px; border-bottom: 1px solid #444; text-align: left; 
    display: flex; justify-content: space-between; align-items: center;
}
.future-tag { color: #888; font-size: 12px; font-style: italic; }

/* 사망 메시지 반짝임 효과 */
#msgContainer { margin: 30px auto; min-height: 80px; }
.death-message { 
    font-size: 20px; font-weight: bold; color: #ff0000;
    text-shadow: 0 0 15px rgba(255,0,0,0.8);
    animation: flashFade 1s infinite alternate;
}
@keyframes flashFade { 
    from { opacity: 1; } 
    to { opacity: 0.4; } 
}

ol { list-style: none; padding: 0; margin: 0; }
</style>
</head>
<body>

<div id="rulesOverlay">
    <div class="curtain" id="leftCurtain"></div>
    <div class="curtain" id="rightCurtain"></div>
    <div class="rules-inner" id="rulesWrapper">
        <div class="select-group">
            <select id="langSelect">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="jp">日本語</option>
            </select>
            <select id="deviceSelect">
                <option value="pc">Pc</option>
                <option value="mobile">Mobile</option>
            </select>
        </div>
        <div id="rulesContent">
            <h1 id="rulesMainTitle" style="font-family:'Creepster'; text-align:center; margin-top:0;">RULES</h1>
            <div id="rulesList"></div>
        </div>
        <button id="agreeBtn" class="btn-style" style="margin-top: 30px; padding: 12px 80px;">AGREE</button>
    </div>
</div>

<div id="mainWrapper">
    <div id="deathNote">
        <div class="title-section">
            <h1>Death Note</h1>
            <div class="title-underline"></div>
            <button id="viewRulesBtn" class="btn-style" style="position:absolute; right: 20px; bottom: -70px; padding: 10px 20px;">RULES</button>
        </div>
        
        <div class="container" style="margin-top: 100px;">
            <div class="input-row"><label id="lb1">누가:</label><input type="text" id="name"></div>
            <div class="input-row"><label id="lb2">언제:</label><input type="text" id="year"></div>
            <div class="input-row"><label id="lb3">몇시:</label><input type="text" id="time"></div>
            <div class="input-row"><label id="lb4">왜:</label><input type="text" id="reason"></div>
            <button id="recordBtn" class="btn-style" style="width: 90%; max-width: 500px; margin-top: 10px; font-size: 20px;">기록하기</button>
        </div>

        <div id="msgContainer"></div>

        <h2 style="font-family:'Creepster'; margin-top: 20px;">DEATH LIST</h2>
        <div id="listContainer">
            <ol id="list"></ol>
        </div>
    </div>
</div>

<script>
const rulesText = {
    ko: ["1. 이 노트에 이름이 적힌 인간은 죽는다.", "2. 얼굴을 모르면 효과가 없다.", "3. 40초 내에 사인을 적으면 그대로 죽는다.", "4. 사인을 적지 않으면 심장마비로 죽는다.", "5. 모든 규칙을 이해했다면 동의를 누르십시오."],
    en: ["1. The human whose name is written shall die.", "2. Face is required for effect.", "3. Cause of death must be written in 40s.", "4. Default cause is heart attack.", "5. Click AGREE to proceed."],
    jp: ["1. 名前を書かれた人間は死ぬ。", "2. 顔を知らないと効果はない。", "3. 40秒以内に死因を書くこと。", "4. 書かなければ心臓麻痺となる。", "5. 同意する場合はボタンを押して。"]
};

const translations = {
    ko: { agree: "동의", addButton: "기록하기", labels: ["누가:","언제:","몇시:","왜:"], future: "(미래의 사망)" },
    en: { agree: "AGREE", addButton: "Record", labels: ["Who:","When:","Time:","Why:"], future: "(Future Death)" },
    jp: { agree: "同意", addButton: "記録", labels: ["名前:","日付:","時間:","理由:"], future: "(未来の死)" }
};

let currentLang = localStorage.getItem("dnLang") || "ko";
let deathList = JSON.parse(localStorage.getItem("dnList")) || [];

function updateUI(){
    const t = translations[currentLang];
    document.getElementById("rulesList").innerHTML = rulesText[currentLang].map(p=>`<p>${p}</p>`).join("");
    document.getElementById("recordBtn").textContent = t.addButton;
    document.getElementById("lb1").textContent = t.labels[0];
    document.getElementById("lb2").textContent = t.labels[1];
    document.getElementById("lb3").textContent = t.labels[2];
    document.getElementById("lb4").textContent = t.labels[3];
    renderList();
}

function renderList() {
    const listEl = document.getElementById("list");
    const t = translations[currentLang];
    listEl.innerHTML = "";
    deathList.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `
            <span><b>${item.name}</b> | ${item.year} (${item.time}) | 사유: ${item.reason}</span>
            <span class="future-tag">${t.future}</span>
        `;
        listEl.appendChild(li);
    });
}

document.getElementById("deviceSelect").addEventListener("change", (e) => {
    document.getElementById("mainWrapper").style.width = (e.target.value === "mobile") ? "375px" : "100%";
});

document.getElementById("langSelect").addEventListener("change", (e)=>{
    currentLang = e.target.value;
    localStorage.setItem("dnLang", currentLang);
    updateUI();
});

document.getElementById("agreeBtn").addEventListener("click", ()=>{
    document.getElementById("rulesWrapper").style.opacity = "0";
    setTimeout(() => {
        document.getElementById("leftCurtain").style.transform = "translateX(-100%)";
        document.getElementById("rightCurtain").style.transform = "translateX(100%)";
        setTimeout(() => {
            document.getElementById("rulesOverlay").style.display = "none";
            document.getElementById("deathNote").style.display = "block";
        }, 800);
    }, 300);
});

document.getElementById("viewRulesBtn").addEventListener("click", () => {
    document.getElementById("rulesOverlay").style.display = "flex";
    setTimeout(() => {
        document.getElementById("leftCurtain").style.transform = "translateX(0)";
        document.getElementById("rightCurtain").style.transform = "translateX(0)";
        setTimeout(() => { document.getElementById("rulesWrapper").style.opacity = "1"; }, 800);
    }, 10);
});

document.getElementById("recordBtn").addEventListener("click", ()=>{
    const n=document.getElementById("name").value.trim();
    const y=document.getElementById("year").value.trim();
    const t_val=document.getElementById("time").value.trim();
    const r=document.getElementById("reason").value.trim();

    if(!n || !y || !t_val || !r){ alert("모두 입력하십시오."); return; }

    const newItem = { name: n, year: y, time: t_val, reason: r };
    deathList.unshift(newItem);
    localStorage.setItem("dnList", JSON.stringify(deathList));
    renderList();

    // 사망 메시지 출력 로직 (깜빡임 효과)
    const msgContainer = document.getElementById("msgContainer");
    msgContainer.innerHTML = `<div class="death-message">
        ${n}은(는) 사망했다.<br>
        ${y}(${t_val})<br>
        사유: ${r}
    </div>`;
    
    // 5초 뒤 메시지 삭제
    setTimeout(() => { msgContainer.innerHTML = ""; }, 5000);

    ["name","year","time","reason"].forEach(id => document.getElementById(id).value="");
});

updateUI();
document.getElementById("langSelect").value = currentLang;
</script>
</body>
</html>
