<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Death Note</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=East+Sea+Dokdo&family=Rubik+Glitch&display=swap" rel="stylesheet">

<style>
body { 
    margin: 0; 
    font-family: 'East Sea Dokdo', 'Rubik Glitch', "Hiragino Mincho ProN", "MS PMincho", "STSong", "궁서", serif; 
    background: radial-gradient(circle, #111 0%, #000 100%); 
    color: #ff1a1a; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-height: 100vh; 
}

#mainWrapper { width: 100%; max-width: 1200px; transition: all 0.5s ease; padding: 20px; box-sizing: border-box; }
.mobile-view { max-width: 380px !important; border: 2px solid #333; background: rgba(0,0,0,0.4); }

/* 타이틀 섹션 */
.title-section { width: 100%; margin-bottom: 20px; position: relative; }
.title-section h1 { font-size: 3.5rem; margin: 0; font-family: 'Creepster'; letter-spacing: 3px; color: #ff1a1a; text-shadow: 0 0 8px #ff0000; }
.title-underline { width: 100%; height: 4px; background-color: #ff1a1a; margin-top: 15px; }

/* 🔴 룰 박스: 이름 위 오른쪽 배치 */
#rulesOverlay { 
    display: none; 
    width: 100%; 
    max-width: 500px; 
    margin: 10px 0 15px auto; /* 왼쪽 자동 여백으로 오른쪽 정렬 */
    text-align: right;
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

.rules-inner { 
    position: relative; 
    width: 100%; 
    background: rgba(0,0,0,0.95); 
    border: 2px solid #ff1a1a; 
    padding: 15px; 
    box-sizing: border-box;
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
}

#rulesMainTitle { font-family: 'Creepster'; font-size: 2.2rem; margin: 0 0 10px 0; text-align: center; }
.select-group { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
select, .btn-style { background: black; color: red; border: 1px solid red; padding: 6px 12px; font-family: inherit; cursor: pointer; font-size: 16px; }

#rulesContent { 
    height: 200px; 
    overflow-y: auto; 
    text-align: left; 
    padding: 15px; 
    font-size: 22px; 
    line-height: 1.4;
    border-top: 1px solid #444;
}

/* 입력 컨테이너 */
.container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; }
input, #recordBtn { width: 100%; max-width: 350px; padding: 12px; background: black; border: 1px solid red; color: red; font-size: 24px; font-family: inherit; outline: none; box-sizing: border-box; }
#recordBtn { font-family: 'Creepster'; cursor: pointer; font-size: 20px; transition: 0.3s; margin-top: 5px; }

#listHeader { cursor: pointer; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }
#listHeader h2 { font-family: 'Creepster'; font-size: 2rem; margin: 0; color: #ff1a1a; text-shadow: 0 0 6px #ff0000; }
#listContainer { max-height: 500px; overflow-y: auto; width: 100%; max-width: 650px; margin: 10px auto; border: 2px solid #ff1a1a; background: rgba(10, 0, 0, 0.8); text-align: left; }

li { padding: 15px 20px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
.li-content { font-size: 24px; line-height: 1.3; color: #ff1a1a; flex: 1; }
.small-btn { font-family: inherit; background: black; border: 1px solid red; color: red; cursor: pointer; font-size: 18px; padding: 4px 12px; }

#msgContainer { margin: 10px auto; min-height: 80px; }
.death-message { font-size: 26px; font-weight: bold; color: #ff0000; }
.flashing { animation: flashFade 1.2s infinite alternate; }
@keyframes flashFade { 0% { opacity: 1; } 100% { opacity: 0.3; } }
</style>
</head>
<body>

<div id="mainWrapper">
    <div class="title-section">
        <h1>Death Note</h1>
        <div class="title-underline"></div>
        <button id="viewRulesBtn" class="btn-style" style="position: absolute; right: 0; top: 75px;">RULES</button>
    </div>

    <div id="rulesOverlay">
        <div class="rules-inner" id="rulesWrapper">
            <h1 id="rulesMainTitle">RULES</h1>
            <div class="select-group">
                <select id="langSelect">
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                    <option value="jp">日本語</option>
                </select>
                <select id="deviceSelect"><option value="pc">PC</option><option value="mobile">MOBILE</option></select>
            </div>
            <div id="rulesContent"><div id="rulesList"></div></div>
            <button id="agreeBtn" class="btn-style" style="margin-top: 15px; width: 100%;">CLOSE</button>
        </div>
    </div>

    <div class="container">
        <input type="text" id="name"><input type="text" id="year"><input type="text" id="time"><input type="text" id="reason">
        <button id="recordBtn">RECORD</button>
    </div>
    
    <div id="msgContainer"></div>
    
    <div id="listToggleArea">
        <div id="listHeader"><h2>DEATH LIST</h2><span id="tIcon">▼</span></div>
        <div id="listContainer"><ol id="list"></ol></div>
    </div>
</div>

<script>
const translations = {
    ko: { agree: "닫기", addButton: "기록하기", save: "저장", placeholders: ["이름:", "날짜:", "시간:", "사유:"], deathMsg: (n,y,t,r) => `${n}은(는) 사망했다.<br>${y} (${t})<br>사유: ${r}`, deleteMsg: (n) => `${n}의 이름이 명단에서 사라졌다.`, listLabels: ["이름:", "일시:", "사유:"], edit: "수정", del: "삭제", rules: ["1. 이 노트에 이름이 적힌 인간은 죽는다.", "2. 얼굴을 모르면 효과가 없다.", "3. 40초 내에 사인을 적으면 그대로 죽는다.", "4. 사인을 적지 않으면 심장마비로 죽는다.", "5. 모든 규칙을 이해했다면 동의를 누르십시오."] },
    en: { agree: "CLOSE", addButton: "RECORD", save: "SAVE", placeholders: ["Name:", "Date:", "Time:", "Reason:"], deathMsg: (n,y,t,r) => `${n} has died.<br>${y} (${t})<br>Reason: ${r}`, deleteMsg: (n) => `${n}'s name has vanished.`, listLabels: ["Name:", "Date:", "Reason:"], edit: "Edit", del: "Delete", rules: ["1. The human whose name is written in this note shall die.", "2. It will not take effect unless the writer has the person's face in mind.", "3. If the cause of death is written within 40 seconds, it will happen.", "4. If not specified, the person will die of a heart attack.", "5. If you understand, click Agree."] },
    jp: { agree: "閉じる", addButton: "記録", save: "保存", placeholders: ["名前:", "日付:", "時間:", "理由:"], deathMsg: (n,y,t,r) => `${n}は死亡した.<br>${y} (${t})<br>理由: ${r}`, deleteMsg: (n) => `${n}の名は消え去った.`, listLabels: ["名前:", "日時:", "理由:"], edit: "修正", del: "삭제", rules: ["1. このノートに名前を書かれた人間は死ぬ。", "2. 顔がわからなければ効果はない。", "3. 40秒以内に死因を書けばその通りになる。", "4. 死因を書かなければ心臓麻痺で死ぬ。", "5. 全ての規則を理解したら同意を押せ。"] }
};

let currentLang = "ko";
let deathList = JSON.parse(localStorage.getItem("dnList")) || [];
let typingInterval;

function updateUI(){
    const t = translations[currentLang];
    document.getElementById("rulesList").innerHTML = t.rules.map(p=>`<p>${p}</p>`).join("");
    document.getElementById("agreeBtn").textContent = t.agree;
    document.getElementById("recordBtn").textContent = t.addButton;
    ["name","year","time","reason"].forEach((id, i) => document.getElementById(id).placeholder = t.placeholders[i]);
    renderList();
}

function renderList() {
    const listEl = document.getElementById("list");
    const t = translations[currentLang];
    listEl.innerHTML = "";
    deathList.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<div class="li-content"><b>${item.name}</b> | ${item.year} (${item.time})<br>${item.reason}</div>
                        <div class="li-btns"><button class="small-btn" onclick="deleteItem(${index})">${t.del}</button></div>`;
        listEl.appendChild(li);
    });
}

function deleteItem(index) {
    deathList.splice(index, 1);
    localStorage.setItem("dnList", JSON.stringify(deathList));
    renderList();
}

document.getElementById("recordBtn").addEventListener("click", () => {
    const vals = ["name","year","time","reason"].map(id => document.getElementById(id).value.trim());
    if (vals.some(v => !v)) return;
    deathList.unshift({ name: vals[0], year: vals[1], time: vals[2], reason: vals[3] });
    localStorage.setItem("dnList", JSON.stringify(deathList));
    updateUI();
    ["name","year","time","reason"].forEach(id => document.getElementById(id).value = "");
});

document.getElementById("viewRulesBtn").addEventListener("click", () => {
    const overlay = document.getElementById("rulesOverlay");
    overlay.style.display = (overlay.style.display === "block") ? "none" : "block";
});

document.getElementById("agreeBtn").addEventListener("click", () => {
    document.getElementById("rulesOverlay").style.display = "none";
});

document.getElementById("deviceSelect").addEventListener("change", (e) => {
    const wrapper = document.getElementById("mainWrapper");
    if(e.target.value === "mobile") wrapper.classList.add("mobile-view");
    else wrapper.classList.remove("mobile-view");
});

document.getElementById("langSelect").addEventListener("change", (e) => { 
    currentLang = e.target.value; 
    updateUI(); 
});

updateUI();
</script>
</body>
</html>
