<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Death Note - Final Edition</title>

    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

    <style>
        /* --- 기본 테마 및 변수 --- */
        :root {
            --death-red: #ff1a1a;
            --death-black: #000000;
            --border-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "궁서", serif;
            background: #000;
            color: var(--death-red);
            overflow-x: hidden;
        }

        /* --- 커튼 애니메이션 (무대 효과) --- */
        #curtain-left, #curtain-right {
            position: fixed;
            top: 0; width: 50%; height: 100%;
            background: #000;
            z-index: 10000;
            transition: transform 1.5s cubic-bezier(0.7, 0, 0.3, 1);
            border: 1px solid #1a1a1a;
        }
        #curtain-left { left: 0; }
        #curtain-right { right: 0; }
        .open #curtain-left { transform: translateX(-100%); }
        .open #curtain-right { transform: translateX(100%); }

        /* --- 룰 오버레이 (첫 진입 화면) --- */
        #rulesOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        #rulesContent {
            max-width: 450px;
            text-align: left;
            margin: 20px;
            line-height: 1.8;
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        /* --- 메인 화면 레이아웃 (PC 기본) --- */
        #deathNote { display: none; }
        .visible #deathNote { display: block; }

        .main-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* PC: 입력창(좌) 리스트(우) */
            gap: 50px;
            opacity: 0;
            transition: opacity 1s;
        }
        .visible .main-wrapper { opacity: 1; }

        /* 제목 스타일 */
        h1 {
            font-family: 'Creepster', cursive;
            font-size: 5rem;
            text-shadow: 0 0 20px var(--death-red);
            margin: 0;
            grid-column: span 2; /* 제목은 전체 너비 */
        }

        /* 미니 룰 박스 (제목 밑 오른쪽) */
        .mini-rules-container {
            grid-column: span 2;
            text-align: right;
            margin-bottom: 20px;
        }
        #miniRules {
            display: inline-block;
            border: 1px solid var(--death-red);
            padding: 10px 15px;
            font-size: 0.85rem;
            background: rgba(20, 0, 0, 0.8);
            text-align: left;
            max-width: 280px;
        }

        /* 입력 섹션 */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 25px;
            background: rgba(10, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        input, button {
            padding: 15px;
            background: #000;
            border: 1px solid var(--death-red);
            color: var(--death-red);
            font-size: 1rem;
        }

        button { 
            cursor: pointer; 
            font-family: 'Creepster'; 
            font-size: 1.2rem;
            transition: 0.3s;
        }
        button:hover { background: var(--death-red); color: #000; }

        /* 리스트 섹션 */
        .list-section {
            border-left: 2px solid var(--border-color);
            padding-left: 30px;
            text-align: left;
        }

        #listContainer li {
            list-style: none;
            padding: 25px;
            border: 2px solid var(--death-red);
            background: #050000;
            box-shadow: inset 0 0 15px rgba(255,0,0,0.1);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

        /* 사망 강조 문구 */
        .death-alert-text {
            color: #ff0000;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 15px;
            display: block;
            text-decoration: underline;
            text-shadow: 0 0 5px rgba(255,0,0,0.5);
        }

        /* --- [확연한 구분] MOBILE 모드 스타일 --- */
        .mobile-mode .main-wrapper {
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
        }
        .mobile-mode h1 { font-size: 3rem; }
        .mobile-mode .list-section {
            border-left: none;
            border-top: 2px solid var(--border-color);
            padding: 30px 0;
        }
        .mobile-mode .mini-rules-container { text-align: center; }

        /* 상단 컨트롤러 (언어/모드) */
        .top-nav {
            position: absolute;
            top: 15px; right: 15px;
            display: flex; gap: 8px;
            z-index: 10001;
        }
        select {
            background: #000;
            color: var(--death-red);
            border: 1px solid var(--death-red);
            padding: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="curtain-left"></div>
    <div id="curtain-right"></div>

    <div class="top-nav">
        <select id="langSelect">
            <option value="ko">KOREAN</option>
            <option value="en">ENGLISH</option>
            <option value="jp">日本語</option>
        </select>
        <select id="modeSelect">
            <option value="pc">PC MODE</option>
            <option value="mobile">MOBILE MODE</option>
        </select>
    </div>

    <div id="rulesOverlay">
        <h1 style="font-size: 4rem; margin-bottom: 20px;">RULES</h1>
        <div id="rulesContent"></div>
        <button id="agreeBtn" style="padding: 10px 60px;">AGREE</button>
    </div>

    <div id="deathNote">
        <div class="main-wrapper" id="mainWrapper">
            <h1>Death Note</h1>

            <div class="mini-rules-container">
                <div id="miniRules"></div>
            </div>
            
            <div class="input-section">
                <input type="text" id="name" placeholder="이름">
                <input type="text" id="year" placeholder="날짜">
                <input type="text" id="time" placeholder="시간">
                <input type="text" id="reason" placeholder="사인">
                <button id="recordBtn">RECORD</button>
            </div>

            <div class="list-section">
                <h2 style="font-family: 'Creepster'; letter-spacing: 3px;">DEATH LIST</h2>
                <div id="listContainer">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            ko: {
                rules: ["1. 대상의 정보를 정확히 입력하십시오.", "2. 새 이름 기록 시 이전 명단은 즉시 소멸됩니다.", "3. 사인은 붉은 글씨로 하단에 표시됩니다."],
                placeholders: ["이름", "날짜 (예: 2026.03.31)", "시간 (예: 14:00)", "사인 (예: 심장마비)"],
                alert: (n, r) => `${n}은(는) 사망했다. (사인: ${r})`,
                agree: "동의",
                listTitle: "DEATH LIST"
            },
            en: {
                rules: ["1. Enter target information accurately.", "2. Previous record is destroyed upon new entry.", "3. Death cause is shown in red at the bottom."],
                placeholders: ["Name", "Date", "Time", "Reason of Death"],
                alert: (n, r) => `${n} has died. (Cause: ${r})`,
                agree: "AGREE",
                listTitle: "DEATH LIST"
            },
            jp: {
                rules: ["1. 対象の情報を正確に入力してください。", "2. 新しい名前を書き込むと前の記録は消滅します。", "3. 死인은 赤い文字で下段に表示されます。"],
                placeholders: ["名前", "日付", "時間", "死因"],
                alert: (n, r) => `${n}は死亡した。(死因: ${r})`,
                agree: "同意",
                listTitle: "DEATH LIST"
            }
        };

        let currentLang = "ko";

        function updateUI() {
            const t = translations[currentLang];
            // 룰 업데이트
            document.getElementById("rulesContent").innerHTML = t.rules.map(r => `<p>${r}</p>`).join("");
            document.getElementById("miniRules").innerHTML = t.rules.map(r => `<div>${r}</div>`).join("");
            document.getElementById("agreeBtn").textContent = t.agree;
            
            // 입력창 업데이트
            const inputs = ["name", "year", "time", "reason"];
            inputs.forEach((id, i) => document.getElementById(id).placeholder = t.placeholders[i]);
        }

        // 모드 변경 (PC / MOBILE)
        document.getElementById("modeSelect").addEventListener("change", (e) => {
            if(e.target.value === "mobile") {
                document.body.classList.add("mobile-mode");
            } else {
                document.body.classList.remove("mobile-mode");
            }
        });

        // 언어 변경
        document.getElementById("langSelect").addEventListener("change", (e) => {
            currentLang = e.target.value;
            updateUI();
        });

        // 커튼 열기 및 시작
        document.getElementById("agreeBtn").addEventListener("click", () => {
            document.body.classList.add("open"); // 커튼 가동
            setTimeout(() => {
                document.getElementById("rulesOverlay").style.display = "none";
                document.body.classList.add("visible");
            }, 1500);
        });

        // 명단 기록 (이전 것 삭제 로직 포함)
        document.getElementById("recordBtn").addEventListener("click", () => {
            const name = document.getElementById("name").value.trim();
            const year = document.getElementById("year").value.trim();
            const time = document.getElementById("time").value.trim();
            const reason = document.getElementById("reason").value.trim();

            if(!name || !year || !time || !reason) {
                alert(currentLang === 'ko' ? "모든 정보를 입력하십시오." : "Please fill all fields.");
                return;
            }

            // [중요] 이전 명단 지우기
            const container = document.getElementById("listContainer");
            container.innerHTML = ""; 

            // 새로운 명단 추가
            const li = document.createElement("li");
            li.innerHTML = `
                <div style="color: #666; font-size: 0.85rem;">DATE: ${year} / TIME: ${time}</div>
                <div style="font-size: 1.5rem; margin: 10px 0; color: #fff;">TARGET: ${name}</div>
                <span class="death-alert-text">${translations[currentLang].alert(name, reason)}</span>
            `;
            container.appendChild(li);

            // 입력창 초기화
            ["name", "year", "time", "reason"].forEach(id => document.getElementById(id).value = "");
        });

        // 초기 실행
        updateUI();
    </script>
</body>
</html>
