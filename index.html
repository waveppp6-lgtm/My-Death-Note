<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Death Note</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "궁서", serif;
    background: radial-gradient(circle, #111 0%, #000 100%);
    color: #ff1a1a;
    text-align: center;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
}

#mainWrapper {
    width: 100%;
    max-width: 1200px;
    transition: width 0.5s ease;
    padding: 20px;
}

/* 룰 화면 & 커튼 효과 */
#rulesOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 9999;
    display: flex;
}
.curtain {
    width: 50%; height: 100%;
    background: black;
    transition: transform 1s ease-in-out;
    border: 1px solid #1a1a1a;
}

.rules-inner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10000;
    width: 90%;
}

#rulesContent {
    height: 220px;
    overflow-y: auto;
    text-align: left;
    margin: 20px auto;
    line-height: 1.6em;
    border: 1px solid #444;
    padding: 20px;
    max-width: 500px;
    background: rgba(0,0,0,0.85);
    font-size: 14px;
    scrollbar-width: thin;
    scrollbar-color: red black;
}

/* 상단 선택바 스타일 */
.select-group { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
select, .btn-style {
    background: black; color: red; border: 1px solid red;
    padding: 6px 12px; font-family: 'Creepster', "궁서";
    cursor: pointer; font-size: 14px;
}

/* 메인 화면 */
#deathNote { display: none; margin-top: 40px; }
.title-section { position: relative; display: inline-block; margin-bottom: 30px; }

/* 리스트 스크롤 박스 */
#listContainer {
    height: 250px;
    overflow-y: auto;
    width: 100%;
    max-width: 600px;
    margin: 10px auto;
    border: 1px solid #333;
    background: rgba(10, 0, 0, 0.5);
    scrollbar-width: thin;
    scrollbar-color: red black;
}

.container { display: flex; flex-direction: column; align-items: center; gap: 12px; }
input, #recordBtn { 
    padding: 12px; background: black; border: 1px solid red; 
    color: red; font-size: 16px; width: 90%; max-width: 350px;
}

/* 사망 메시지 */
#msgContainer { margin: 20px auto; min-height: 25px; }
.death-message { 
    font-size: 18px; font-weight: bold; color: #ff0000;
    text-shadow: 0 0 10px rgba(255,0,0,0.7);
    animation: fadeIn 0.8s ease;
}

ol { list-style: none; padding: 0; margin: 0; }
li { padding: 15px; border-bottom: 1px solid #333; text-align: left; animation: fadeIn 0.5s; }
@keyframes fadeIn { from {opacity:0} to {opacity:1} }
</style>
</head>
<body>

<div id="rulesOverlay">
    <div class="curtain" id="leftCurtain"></div>
    <div class="curtain" id="rightCurtain"></div>
    <div class="rules-inner" id="rulesWrapper">
        <div class="select-group">
            <select id="langSelect">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="jp">日本語</option>
                <option value="ru">Русский</option>
                <option value="cn">中文</option>
            </select>
            <select id="deviceSelect">
                <option value="pc">Pc</option>
                <option value="mobile">Mobile</option>
            </select>
        </div>
        <h1 id="rulesMainTitle" style="font-family:'Creepster'; font-size: 3rem;">How to use it</h1>
        <div id="rulesContent"></div>
        <button id="agreeBtn" class="btn-style" style="padding: 10px 40px;">AGREE</button>
    </div>
</div>

<div id="mainWrapper">
    <div id="deathNote">
        <div class="title-section">
            <h1 style="font-size: 3.5rem; margin:0; font-family:'Creepster'">Death Note</h1>
            <button id="viewRulesBtn" class="btn-style" style="position:absolute; bottom:-15px; right:-20px; font-size: 10px;">RULES</button>
        </div>
        
        <div class="container">
            <input type="text" id="name" placeholder="">
            <input type="text" id="year" placeholder="">
            <input type="text" id="time" placeholder="">
            <input type="text" id="reason" placeholder="">
            <button id="recordBtn"></button>
        </div>

        <div id="msgContainer"></div>

        <h2 style="font-family:'Creepster'; margin-bottom: 5px;">LIST</h2>
        <div id="listContainer">
            <ol id="list"></ol>
        </div>
    </div>
</div>

<script>
const rulesText = {
    ko: ["1. 이 노트에 이름이 적힌 인간은 죽는다.", "2. 적으려는 인물의 얼굴을 모르면 효과가 없다.", "3. 이름 뒤에 40초 내에 사인을 적으면 그대로 죽는다.", "4. 사인을 적지 않으면 모두 심장마비로 죽는다.", "5. 사인을 적으면 죽음의 상황을 기재할 6분 40초의 시간이 주어진다."],
    en: ["1. The human whose name is written in this note shall die.", "2. This note will not take effect unless the writer has the person's face in mind.", "3. If the cause of death is written within 40 seconds, it will happen.", "4. If the cause of death is not specified, the person will die of a heart attack.", "5. After writing the cause, details of the death should be written in the next 6 minutes and 40 seconds."],
    jp: ["1. このノートに名前を書かれた人間は死ぬ。", "2. 書く人物の顔が頭に入っていないと効果はない。", "3. 名前の後に40秒以内に死因を書くとその通りになる。", "4. 死因を書かなければ全て心臓麻痺となる。", "5. 死因を書くとさらに6分40秒間の詳しい死の状況を記載する時間が与えられる。"],
    ru: ["1. Человек, чье имя записано в этой тетради, умрет.", "2. Тетрадь не подействует, если вы не знаете лица жертвы.", "3. Если причина смерти написана в течение 40 секунд, так и случится.", "4. Если причина не указана, человек умрет от сердечного приступа.", "5. После написания причины у вас есть 6 минут 40 секунд для деталей."],
    cn: ["1. 名字被写在名字被写在笔记上的人都会死。", "2. 如果不知道对方的面孔，笔记将不会生效。", "3. 在写下名字后的40秒内编写死因，对方就会照此死去。", "4. 如果没有写死因，那个人将死于心脏麻痹。", "5. 写下死因后，你还有6分40秒的时间可以记入详细的死亡过程。"]
};

const translations = {
    ko: { rulesTitle: "How to use it", agree: "동의", alertEmpty: "모든 항목을 입력해주세요!", addButton: "기록하기", deathMessage: (n)=>`▷ ${n}은(는) 사망했습니다.`, placeholder: {name:"이름",year:"날짜",time:"시간",reason:"사인"}, inputLabels:["이름:","사인:"] },
    en: { rulesTitle: "How to use it", agree: "AGREE", alertEmpty: "Please fill all fields!", addButton: "Record", deathMessage: (n)=>`▷ ${n} has died.`, placeholder: {name:"Name",year:"Date",time:"Time",reason:"Reason"}, inputLabels:["Name:","Reason:"] },
    jp: { rulesTitle: "How to use it", agree: "同意", alertEmpty: "入力してください！", addButton: "記録", deathMessage: (n)=>`▷ ${n}は死亡した。`, placeholder: {name:"名前",year:"年月日",time:"時間",reason:"理由"}, inputLabels:["名前:","理由:"] },
    ru: { rulesTitle: "How to use it", agree: "СОГЛАСЕН", alertEmpty: "Заполните поля!", addButton: "Записать", deathMessage: (n)=>`▷ ${n} умер.`, placeholder: {name:"Имя",year:"Дата",time:"Время",reason:"Причина"}, inputLabels:["Имя:","Причина:"] },
    cn: { rulesTitle: "How to use it", agree: "同意", alertEmpty: "请填写字段！", addButton: "添加", deathMessage: (n)=>`▷ ${n}死亡了。`, placeholder: {name:"姓名",year:"日期",time:"时间",reason:"原因"}, inputLabels:["姓名:","原因:"] }
};

let currentLang = "ko";
let lastVictimName = null;

const deathNote = document.getElementById("deathNote");
const rulesOverlay = document.getElementById("rulesOverlay");
const leftCurtain = document.getElementById("leftCurtain");
const rightCurtain = document.getElementById("rightCurtain");
const rulesWrapper = document.getElementById("rulesWrapper");
const mainWrapper = document.getElementById("mainWrapper");

function updateUI(){
    const t = translations[currentLang];
    document.getElementById("rulesMainTitle").textContent = t.rulesTitle;
    document.getElementById("agreeBtn").textContent = t.agree;
    document.getElementById("rulesContent").innerHTML = rulesText[currentLang].map(p=>`<p>${p}</p>`).join("");
    document.getElementById("name").placeholder = t.placeholder.name;
    document.getElementById("year").placeholder = t.placeholder.year;
    document.getElementById("time").placeholder = t.placeholder.time;
    document.getElementById("reason").placeholder = t.placeholder.reason;
    document.getElementById("recordBtn").textContent = t.addButton;
}

document.getElementById("deviceSelect").addEventListener("change", (e) => {
    mainWrapper.style.width = (e.target.value === "mobile") ? "375px" : "100%";
});

document.getElementById("langSelect").addEventListener("change", (e)=>{
    currentLang = e.target.value;
    updateUI();
});

document.getElementById("agreeBtn").addEventListener("click", ()=>{
    rulesWrapper.style.opacity = "0";
    setTimeout(() => {
        rulesWrapper.style.display = "none";
        leftCurtain.style.transform = "translateX(-100%)";
        rightCurtain.style.transform = "translateX(100%)";
        setTimeout(() => {
            rulesOverlay.style.display = "none";
            deathNote.style.display = "block";
        }, 800);
    }, 300);
});

document.getElementById("viewRulesBtn").addEventListener("click", () => {
    rulesOverlay.style.display = "flex";
    setTimeout(() => {
        leftCurtain.style.transform = "translateX(0)";
        rightCurtain.style.transform = "translateX(0)";
        setTimeout(() => { rulesWrapper.style.display = "block"; rulesWrapper.style.opacity = "1"; }, 800);
    }, 10);
});

document.getElementById("recordBtn").addEventListener("click", ()=>{
    const name=document.getElementById("name").value.trim();
    const year=document.getElementById("year").value.trim();
    const time=document.getElementById("time").value.trim();
    const reason=document.getElementById("reason").value.trim();
    const t = translations[currentLang];

    if(!name || !year || !time || !reason){ alert(t.alertEmpty); return; }

    // 이전 사람 사망 메시지 출력
    if(lastVictimName) {
        const msgContainer = document.getElementById("msgContainer");
        msgContainer.innerHTML = `<div class="death-message">${t.deathMessage(lastVictimName)}</div>`;
    }

    // 리스트 추가
    const li = document.createElement("li");
    li.innerHTML = `<div><b>${t.inputLabels[0]}</b> ${name} | <b>${t.inputLabels[1]}</b> ${reason}</div>`;
    document.getElementById("list").prepend(li);

    lastVictimName = name;

    ["name","year","time","reason"].forEach(id => document.getElementById(id).value="");
});

updateUI();
</script>
</body>
</html>
