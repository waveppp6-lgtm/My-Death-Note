<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Death Note</title>

<meta property="og:title" content="DEATH NOTE">
<meta property="og:description" content="이름을 적으시겠습니까? 40초 뒤에 이름은 사라집니다... 📓🖋️">
<meta property="og:image" content="https://raw.githubusercontent.com/waveppp6-lgtm/My-Death-Note/main/preview.jpg">
<meta property="og:url" content="https://waveppp6-lgtm.github.io/My-Death-Note/">
<meta name="theme-color" content="#000000">

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "궁서", serif;
    background: radial-gradient(circle, #111 0%, #000 100%);
    color: #ff1a1a;
    text-align: center;
    overflow-x: hidden;
}

/* 룰 화면 */
#rulesOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: black;
    color: red;
    font-family: 'Creepster', "궁서", serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-shadow: 0 0 10px red, 0 0 20px red;
    z-index: 9999;
}
#rulesOverlay h1 { font-size: 8vw; margin-bottom: 20px; }

/* 룰 상단 바 */
#ruleTopBar {
    position: absolute;
    top: 10px; right: 20px;
    display: flex; gap: 10px;
    align-items: center;
}
#ruleTopBar select {
    background: black;
    color: red;
    border: 1px solid red;
    padding: 4px 8px;
    font-family: 'Creepster', "궁서", serif;
    font-size: 14px;
}

/* 룰 내용 스크롤 */
#rulesContent {
    height: 180px;
    overflow-y: auto;
    text-align: left;
    margin: 10px 20px;
    line-height: 1.5em;
    scrollbar-width: thin;
    scrollbar-color: red black;
    border: 1px solid #333;
    padding: 15px;
    max-width: 500px;
}
#rulesContent::-webkit-scrollbar { width: 5px; }
#rulesContent::-webkit-scrollbar-thumb { background: red; }

#rulesOverlay button {
    font-size: 5vw;
    padding: 10px 40px;
    border: 2px solid red;
    background: black;
    color: red;
    cursor: pointer;
    margin-top: 25px;
}
#rulesOverlay button:active { background: red; color: black; }

/* Death Note 화면 */
#deathNote { display: none; padding: 20px; }

h1, h2 {
    font-family: 'Creepster', "궁서", serif;
    text-shadow: 0 0 10px red, 0 0 20px red;
}

.container { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
input, button { 
    padding: 12px; 
    background: black; 
    border: 1px solid red; 
    color: red; 
    font-size: 16px; 
    text-align: center;
    width: 90%;
    max-width: 350px;
}
label.checkbox-label { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    background: black; 
    color: red; 
    border: 1px solid red; 
    padding: 8px 15px; 
    font-size: 16px; 
    min-width: 180px;
}
label.checkbox-label input[type="checkbox"] { width: 22px; height: 22px; margin-left: 10px; }

ol { list-style: none; padding: 0; width: 100%; max-width: 600px; margin: 20px auto; }
li { 
    margin-bottom: 15px; 
    padding: 15px; 
    border: 1px solid red; 
    background: rgba(20, 0, 0, 0.8);
    text-align: left;
    animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

.input-box span { display: block; margin-bottom: 3px; font-size: 14px; }

.death-message { 
    font-size: 16px; 
    padding: 15px; 
    border: 1px dashed red; 
    color: white; 
    background: #000;
    margin: 10px auto;
    max-width: 600px;
    animation: flash 1s infinite alternate;
}
@keyframes flash { from {opacity: 0.5;} to {opacity: 1;} }

#viewRulesBtn {
    position: fixed;
    top: 10px; right: 10px;
    background: black;
    color: red;
    border: 1px solid red;
    padding: 5px 10px;
    font-family: 'Creepster', "궁서", serif;
    z-index: 500;
}
</style>
</head>
<body>

<div id="rulesOverlay">
    <div id="ruleTopBar">
        <select id="langSelect">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="jp">日本語</option>
            <option value="ru">Русский</option>
            <option value="cn">中文</option>
        </select>
    </div>
    <h1 id="rulesMainTitle">RULES</h1>
    <div id="rulesContent"></div>
    <button id="agreeBtn">동의</button>
</div>

<div id="deathNote">
    <h1>Death Note</h1>
    <div class="container">
        <input type="text" id="name" placeholder="">
        <input type="text" id="year" placeholder="">
        <input type="text" id="time" placeholder="">
        <input type="text" id="reason" placeholder="">
        <label class="checkbox-label">
            <span id="effectText"></span>
            <input type="checkbox" id="effectOption" checked>
        </label>
        <button id="recordBtn"></button>
    </div>
    <br>
    <h2>LIST</h2>
    <ol id="list"></ol>
    <button id="viewRulesBtn">RULES</button>
</div>

<script>
const rulesText = {
    ko: ["1. 이름과 시간, 날짜를 정확히 입력하십시오.", "2. 체크박스 선택 시 사망 메시지가 출력됩니다.", "3. 빈칸이 있으면 기록되지 않습니다.", "4. 리스트에 적힌 이름은 3초 후 사라집니다.", "5. 모든 규칙을 이해했다면 동의를 누르십시오."],
    en: ["1. Enter name and time accurately.", "2. Check the box for death notification.", "3. All fields must be filled.", "4. Names disappear after 3 seconds.", "5. Click agree if you understand."],
    jp: ["1. 名前と時間を正確に入力してください。", "2. チェックボックスで死亡通知が表示されます。", "3. 空欄がある場合は登録できません。", "4. リ스트は3秒後に消去されます。", "5. 同意する場合はボタンを押してください。"],
    ru: ["1. Введите имя и время точно.", "2. Отметьте флажок для уведомления о смерти.", "3. Все поля должны быть заполнены.", "4. Имена исчезают через 3 секунды.", "5. Нажмите Согласен, если поняли."],
    cn: ["1. 请准确输入姓名和时间。", "2. 勾选框以开启死亡通知。", "3. 所有字段必须填写。", "4. 名字将在3秒后消失。", "5. 如果理解请点击同意。"]
};

const translations = {
    ko: { rulesTitle: "RULES", agree: "동의", alertEmpty: "모든 항목을 입력해주세요!", addButton: "기록하기", deathMessage: (n,t,y,r)=>`[기록] ${n}은(는) 사망했습니다. (${y} ${t}, 사유: ${r})`, placeholder: {name:"이름",year:"날짜",time:"시간",reason:"사인"}, effectOption:"사망 알림 효과", inputLabels:["이름:","날짜:","시간:","사인:"] },
    en: { rulesTitle: "RULES", agree: "AGREE", alertEmpty: "Please fill all fields!", addButton: "Record", deathMessage: (n,t,y,r)=>`${n} has died. (${y} ${t}, Cause: ${r})`, placeholder: {name:"Name",year:"Date",time:"Time",reason:"Reason"}, effectOption:"Death Effect", inputLabels:["Name:","Date:","Time:","Reason:"] },
    jp: { rulesTitle: "ルール", agree: "同意", alertEmpty: "入力してください！", addButton: "記録", deathMessage: (n,t,y,r)=>`${n}は死亡した。(${y} ${t}, 理由: ${r})`, placeholder: {name:"名前",year:"年月日",time:"時間",reason:"理由"}, effectOption:"死亡通知", inputLabels:["名前:","日付:","時間:","理由:"] },
    ru: { rulesTitle: "ПРАВИЛА", agree: "СОГЛАСЕН", alertEmpty: "Заполните поля!", addButton: "Записать", deathMessage: (n,t,y,r)=>`${n} умер. (${y} ${t}, причина: ${r})`, placeholder: {name:"Имя",year:"Дата",time:"Время",reason:"Причина"}, effectOption:"Эффект", inputLabels:["Имя:","Дата:","Время:","Причина:"] },
    cn: { rulesTitle: "规则", agree: "同意", alertEmpty: "请填写字段！", addButton: "添加", deathMessage: (n,t,y,r)=>`${n}死亡了。(${y} ${t}, 原因: ${r})`, placeholder: {name:"姓名",year:"日期",time:"时间",reason:"原因"}, effectOption:"死亡提示", inputLabels:["姓名:","日期:","时间:","原因:"] }
};

let currentLang = localStorage.getItem("lang") || "ko";
const deathNote = document.getElementById("deathNote");
const rulesOverlay = document.getElementById("rulesOverlay");
const agreeBtn = document.getElementById("agreeBtn");
const rulesMainTitle = document.getElementById("rulesMainTitle");

function updateUI(){
    const t = translations[currentLang];
    
    // 룰 화면 언어 교체
    rulesMainTitle.textContent = t.rulesTitle;
    agreeBtn.textContent = t.agree;
    document.getElementById("rulesContent").innerHTML = rulesText[currentLang].map(p=>`<p>${p}</p>`).join("");

    // 입력창 언어 교체
    document.getElementById("name").placeholder = t.placeholder.name;
    document.getElementById("year").placeholder = t.placeholder.year;
    document.getElementById("time").placeholder = t.placeholder.time;
    document.getElementById("reason").placeholder = t.placeholder.reason;
    document.getElementById("effectText").textContent = t.effectOption;
    document.getElementById("recordBtn").textContent = t.addButton;
}

document.getElementById("langSelect").addEventListener("change", (e)=>{
    currentLang = e.target.value;
    localStorage.setItem("lang", currentLang);
    updateUI();
});

agreeBtn.addEventListener("click", ()=>{
    rulesOverlay.style.display = "none";
    deathNote.style.display = "block";
});

document.getElementById("viewRulesBtn").addEventListener("click", ()=> rulesOverlay.style.display = "flex");

document.getElementById("recordBtn").addEventListener("click", ()=>{
    const name=document.getElementById("name").value.trim();
    const year=document.getElementById("year").value.trim();
    const time=document.getElementById("time").value.trim();
    const reason=document.getElementById("reason").value.trim();
    const effect=document.getElementById("effectOption").checked;
    const t = translations[currentLang];

    if(!name || !year || !time || !reason){ alert(t.alertEmpty); return; }

    const li = document.createElement("li");
    li.innerHTML = `<div class="input-box">
        <span><b>${t.inputLabels[0]}</b> ${name}</span>
        <span><b>${t.inputLabels[1]}</b> ${year}</span>
        <span><b>${t.inputLabels[2]}</b> ${time}</span>
        <span><b>${t.inputLabels[3]}</b> ${reason}</span>
    </div>`;
    document.getElementById("list").appendChild(li);

    setTimeout(()=>{
        li.remove();
        if(effect) {
            const msg = document.createElement("div");
            msg.className = "death-message";
            msg.textContent = t.deathMessage(name,time,year,reason);
            document.body.appendChild(msg);
            setTimeout(()=>msg.remove(), 4000);
        }
    }, 3000);

    ["name","year","time","reason"].forEach(id => document.getElementById(id).value="");
});

// 초기 실행
updateUI();
document.getElementById("langSelect").value = currentLang;
</script>
</body>
</html>
