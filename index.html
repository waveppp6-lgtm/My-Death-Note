<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Death Note</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=East+Sea+Dokdo&family=Rubik+Glitch&display=swap" rel="stylesheet">

<style>
body { 
    margin: 0; 
    font-family: 'East Sea Dokdo', 'Rubik Glitch', "Hiragino Mincho ProN", "MS PMincho", "STSong", "궁서", serif; 
    background: radial-gradient(circle, #111 0%, #000 100%); 
    color: #ff1a1a; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-height: 100vh; 
}

#mainWrapper { width: 100%; max-width: 1200px; transition: all 0.5s ease; padding: 20px; box-sizing: border-box; }
/* 모바일 뷰 스타일 (기기 선택 시 적용) */
.mobile-view { max-width: 380px !important; border: 2px solid #333; background: rgba(0,0,0,0.4); margin: 0 auto; }

/* 룰 오버레이 및 위치 */
#rulesOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; justify-content: center; align-items: center; }
.curtain { position: absolute; top: 0; width: 50%; height: 100%; background: black; transition: transform 1s ease-in-out; }
#leftCurtain { left: 0; }
#rightCurtain { right: 0; }

.rules-inner { 
    position: relative; 
    z-index: 10000; 
    width: 90%; 
    max-width: 600px; 
    transition: opacity 0.5s; 
}

#rulesMainTitle { font-family: 'Creepster'; font-size: 3.5rem; margin: 0 0 15px 0; text-shadow: 0 0 10px red; }

/* 룰 박스 내부 선택창 그룹 */
.select-group { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 10px; }
select, .btn-style { background: black; color: red; border: 1px solid red; padding: 8px 12px; font-family: inherit; cursor: pointer; font-size: 18px; }

#rulesContent { 
    height: 250px; 
    overflow-y: auto; 
    text-align: left; 
    border: 2px solid #ff1a1a; 
    padding: 25px; 
    background: rgba(0,0,0,0.9); 
    font-size: 22px; 
    line-height: 1.4;
    word-break: keep-all;
}

/* --- 메인 화면 레이아웃 (가려짐 방지 핵심) --- */
.title-section { 
    width: 100%; 
    margin-bottom: 30px; 
    display: flex;
    flex-direction: column; /* 세로로 쌓기 */
    align-items: center;
    position: relative; /* 자식 요소 배치를 위한 기준 */
}

.title-section h1 { 
    font-size: 3.5rem; 
    margin: 0; 
    font-family: 'Creepster'; 
    letter-spacing: 3px; 
    color: #ff1a1a; 
    text-shadow: 0 0 8px #ff0000; 
}

/* 메인 화면의 RULES 버튼: 타이틀 아래 오른쪽에 배치 */
#viewRulesBtn { 
    align-self: flex-end; /* 오른쪽 정렬 */
    margin-top: 10px;
    margin-right: 5%;
    padding: 5px 20px;
}

.container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; }
input, #recordBtn { width: 100%; max-width: 350px; padding: 12px; background: black; border: 1px solid red; color: red; font-size: 24px; font-family: inherit; outline: none; box-sizing: border-box; }
#recordBtn { font-family: 'Creepster'; cursor: pointer; font-size: 20px; transition: 0.3s; margin-top: 5px; }

#listHeader { cursor: pointer; margin-top: 30px; display: flex; justify-content: center; align-items: center; gap: 10px; }
#listHeader h2 { font-family: 'Creepster'; font-size: 2rem; margin: 0; color: #ff1a1a; text-shadow: 0 0 6px #ff0000; }
#listContainer { max-height: 500px; overflow-y: auto; width: 100%; max-width: 650px; margin: 10px auto; border: 2px solid #ff1a1a; background: rgba(10, 0, 0, 0.8); text-align: left; transition: max-height 0.4s ease; }
.collapsed #listContainer { max-height: 0; border-color: transparent; }

li { padding: 15px 20px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
.li-content { font-size: 24px; line-height: 1.3; color: #ff1a1a; flex: 1; }
.small-btn { font-family: inherit; background: black; border: 1px solid red; color: red; cursor: pointer; font-size: 18px; padding: 4px 12px; }

#msgContainer { margin: 10px auto; min-height: 80px; }
.death-message { font-size: 26px; font-weight: bold; color: #ff0000; text-shadow: 0 0 8px rgba(255,0,0,0.8); line-height: 1.3; }
.flashing { animation: flashFade 1.2s infinite alternate; }
@keyframes flashFade { 0% { opacity: 1; } 100% { opacity: 0.3; } }
</style>
</head>
<body>

<div id="rulesOverlay">
    <div class="curtain" id="leftCurtain"></div>
    <div class="curtain" id="rightCurtain"></div>
    <div class="rules-inner" id="rulesWrapper">
        <h1 id="rulesMainTitle">RULES</h1>
        <div class="select-group">
            <select id="langSelect">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="jp">日本語</option>
                <option value="ru">Русский</option>
                <option value="cn">中文</option>
            </select>
            <select id="deviceSelect">
                <option value="pc">PC VIEW</option>
                <option value="mobile">MOBILE VIEW</option>
            </select>
        </div>
        <div id="rulesContent"><div id="rulesList"></div></div>
        <button id="agreeBtn" class="btn-style" style="margin-top: 20px; padding: 10px 80px;">AGREE</button>
    </div>
</div>

<div id="mainWrapper">
    <div class="title-section">
        <h1>Death Note</h1>
        <button id="viewRulesBtn" class="btn-style">RULES</button>
    </div>
    
    <div class="container">
        <input type="text" id="name"><input type="text" id="year"><input type="text" id="time"><input type="text" id="reason">
        <button id="recordBtn">RECORD</button>
    </div>
    <div id="msgContainer"></div>
    <div id="listToggleArea">
        <div id="listHeader"><h2>DEATH LIST</h2><span id="tIcon">▼</span></div>
        <div id="listContainer"><ol id="list"></ol></div>
    </div>
</div>

<script>
const translations = {
    ko: { agree: "동의", addButton: "기록하기", placeholders: ["이름:", "날짜:", "시간:", "사유:"], listLabels: ["이름:", "일시:", "사유:"], del: "삭제", rules: ["1. 이 노트에 이름이 적힌 인간은 죽는다.", "2. 얼굴을 모르면 효과가 없다.", "3. 40초 내에 사인을 적으면 그대로 죽는다.", "4. 사인을 적지 않으면 심장마비로 죽는다.", "5. 모든 규칙을 이해했다면 동의를 누르십시오."] },
    en: { agree: "AGREE", addButton: "RECORD", placeholders: ["Name:", "Date:", "Time:", "Reason:"], listLabels: ["Name:", "Date:", "Reason:"], del: "Delete", rules: ["1. The human whose name is written in this note shall die.", "2. It will not take effect unless the writer has the person's face in mind.", "3. If the cause of death is written within 40 seconds, it will happen.", "4. If not specified, the person will die of a heart attack.", "5. If you understand, click Agree."] },
    jp: { agree: "同意", addButton: "記録", placeholders: ["名前:", "日付:", "時間:", "理由:"], listLabels: ["名前:", "日時:", "理由:"], del: "削除", rules: ["1. このノートに名前を書かれた人間は死ぬ。", "2. 顔이わからなければ効果はない。", "3. 40秒以内に死因を書けばその通りになる。", "4. 死因を書かなければ心臓麻痺で死ぬ。", "5. 全ての規則을理解したら同意を押せ。"] },
    ru: { agree: "Да", addButton: "Запись", placeholders: ["Имя:", "Дата:", "Время:", "Причина:"], listLabels: ["Имя:", "Дата:", "Причина:"], del: "Удл", rules: ["1. Человек, чье имя здесь, умрет.", "2. Нужно знать лицо жертвы.", "3. Причина смерти за 40 сек.", "4. Иначе - сердечный приступ.", "5. Нажмите Да, если поняли."] },
    cn: { agree: "同意", addButton: "记录", placeholders: ["姓名:", "日期:", "时间:", "原因:"], listLabels: ["姓名:", "日期:", "原因:"], del: "删除", rules: ["1. 名字写在上面的人就会死。", "2. 必须知道对方的长상。", "3. 40秒内可以写하死인。", "4. 否则将死于心脏마비。", "5. 理解规则后请点击同意。"] }
};

let currentLang = localStorage.getItem("dnLang") || "ko";
let deathList = JSON.parse(localStorage.getItem("dnList")) || [];

function updateUI(){
    const t = translations[currentLang];
    document.getElementById("rulesList").innerHTML = t.rules.map(p=>`<p>${p}</p>`).join("");
    document.getElementById("agreeBtn").textContent = t.agree;
    document.getElementById("recordBtn").textContent = t.addButton;
    ["name","year","time","reason"].forEach((id, i) => document.getElementById(id).placeholder = t.placeholders[i]);
    renderList();
}

function renderList() {
    const listEl = document.getElementById("list");
    const t = translations[currentLang];
    listEl.innerHTML = "";
    deathList.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<div class="li-content"><b>${t.listLabels[0]}</b> ${item.name} | <b>${t.listLabels[1]}</b> ${item.year} (${item.time})<br><b>${t.listLabels[2]}</b> ${item.reason}</div>
            <div class="li-btns"><button class="small-btn" onclick="deleteItem(${index})">${t.del}</button></div>`;
        listEl.appendChild(li);
    });
}

function deleteItem(index) {
    deathList.splice(index, 1);
    localStorage.setItem("dnList", JSON.stringify(deathList));
    renderList();
}

document.getElementById("recordBtn").addEventListener("click", () => {
    const vals = ["name","year","time","reason"].map(id => document.getElementById(id).value.trim());
    if (vals.some(v => !v)) return;
    deathList.unshift({ name: vals[0], year: vals[1], time: vals[2], reason: vals[3] });
    localStorage.setItem("dnList", JSON.stringify(deathList));
    updateUI();
    ["name","year","time","reason"].forEach(id => document.getElementById(id).value = "");
});

document.getElementById("deviceSelect").addEventListener("change", (e) => {
    const wrapper = document.getElementById("mainWrapper");
    if(e.target.value === "mobile") wrapper.classList.add("mobile-view");
    else wrapper.classList.remove("mobile-view");
});

document.getElementById("listHeader").addEventListener("click", () => {
    document.getElementById("listToggleArea").classList.toggle("collapsed");
    document.getElementById("tIcon").textContent = document.getElementById("listToggleArea").classList.contains("collapsed") ? "▲" : "▼";
});

document.getElementById("langSelect").addEventListener("change", (e) => { 
    currentLang = e.target.value; 
    localStorage.setItem("dnLang", currentLang); 
    updateUI(); 
});

document.getElementById("agreeBtn").addEventListener("click", () => { 
    document.getElementById("rulesWrapper").style.opacity = "0"; 
    setTimeout(() => { 
        document.getElementById("leftCurtain").style.transform = "translateX(-100%)"; 
        document.getElementById("rightCurtain").style.transform = "translateX(100%)"; 
        setTimeout(()=>document.getElementById("rulesOverlay").style.display="none", 800); 
    }, 300); 
});

document.getElementById("viewRulesBtn").addEventListener("click", () => { 
    document.getElementById("rulesOverlay").style.display = "flex"; 
    setTimeout(() => { 
        document.getElementById("leftCurtain").style.transform = "translateX(0)"; 
        document.getElementById("rightCurtain").style.transform = "translateX(0)"; 
        setTimeout(()=>document.getElementById("rulesWrapper").style.opacity="1", 800); 
    }, 10); 
});

updateUI();
</script>
</body>
</html>
