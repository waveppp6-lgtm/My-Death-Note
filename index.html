<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Death Note</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "궁서", serif;
    background: radial-gradient(circle, #111 0%, #000 100%);
    color: #ff1a1a;
    text-align: center;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    transition: all 0.5s ease;
}

#mainWrapper {
    width: 100%;
    max-width: 1200px;
    transition: width 0.5s ease;
    padding: 20px;
}

/* 룰 화면 & 커튼 효과 */
#rulesOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 9999;
    display: flex;
}
.curtain {
    width: 50%; height: 100%;
    background: black;
    transition: transform 1s ease-in-out;
}
#leftCurtain { border-right: 1px solid #222; }
#rightCurtain { border-left: 1px solid #222; }

.rules-inner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: red;
    font-family: 'Creepster', "궁서", serif;
    z-index: 10000;
    width: 90%;
}

#rulesContent {
    height: 180px;
    overflow-y: auto;
    text-align: left;
    margin: 20px auto;
    line-height: 1.5em;
    border: 1px solid #333;
    padding: 15px;
    max-width: 450px;
    background: rgba(0,0,0,0.8);
}

/* 모드 & 언어 선택 */
.select-group { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
.select-group select {
    background: black; color: red; border: 1px solid red;
    padding: 5px; font-family: 'Creepster', "궁서";
}

/* 메인 화면 */
#deathNote { display: none; margin-top: 50px; }

.title-section { position: relative; display: inline-block; }
#viewRulesBtn {
    position: absolute;
    bottom: -5px; right: -45px;
    background: transparent;
    color: red;
    border: 1px solid red;
    padding: 2px 6px;
    font-size: 10px;
    cursor: pointer;
    font-family: 'Creepster';
}

.container { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 30px; }
input, button { 
    padding: 12px; background: black; border: 1px solid red; 
    color: red; font-size: 16px; width: 90%; max-width: 350px;
}

/* 사망 메시지 - 빨간 글씨 */
#msgContainer {
    margin-top: 20px;
    min-height: 30px;
}
.death-message { 
    font-size: 18px; 
    font-weight: bold;
    color: #ff0000;
    text-shadow: 0 0 8px rgba(255,0,0,0.5);
    animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from {opacity:0} to {opacity:1} }

ol { list-style: none; padding: 0; width: 100%; max-width: 600px; margin: 20px auto; }
li { 
    margin-bottom: 10px; padding: 15px; border: 1px solid red; 
    background: rgba(20, 0, 0, 0.7); text-align: left;
}
</style>
</head>
<body>

<div id="rulesOverlay">
    <div class="curtain" id="leftCurtain"></div>
    <div class="curtain" id="rightCurtain"></div>
    <div class="rules-inner" id="rulesWrapper">
        <div class="select-group">
            <select id="langSelect">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="jp">日本語</option>
                <option value="ru">Русский</option>
                <option value="cn">中文</option>
            </select>
            <select id="deviceSelect">
                <option value="pc">Pc</option>
                <option value="mobile">Mobile</option>
            </select>
        </div>
        <h1 id="rulesMainTitle">RULES</h1>
        <div id="rulesContent"></div>
        <button id="agreeBtn" style="cursor:pointer;">동의</button>
    </div>
</div>

<div id="mainWrapper">
    <div id="deathNote">
        <div class="title-section">
            <h1 style="font-size: 3.5rem; margin:0; font-family:'Creepster'">Death Note</h1>
            <button id="viewRulesBtn">RULES</button>
        </div>
        
        <div class="container">
            <input type="text" id="name" placeholder="">
            <input type="text" id="year" placeholder="">
            <input type="text" id="time" placeholder="">
            <input type="text" id="reason" placeholder="">
            <label style="color:red; font-size: 14px; cursor:pointer;">
                <span id="effectText">사망 알림 효과</span>
                <input type="checkbox" id="effectOption" checked>
            </label>
            <button id="recordBtn"></button>
        </div>

        <div id="msgContainer"></div> <h2 style="margin-top:40px; font-family:'Creepster'">LIST</h2>
        <ol id="list"></ol>
    </div>
</div>

<script>
const rulesText = {
    ko: ["1. 이름과 시간, 날짜를 정확히 입력하십시오.", "2. 체크박스 선택 시 사망 메시지가 출력됩니다.", "3. 빈칸이 있으면 기록되지 않습니다.", "4. 다음 이름을 적을 때 이전 사람이 사망합니다.", "5. 모든 규칙을 이해했다면 동의를 누르십시오."],
    en: ["1. Enter name and time accurately.", "2. Check the box for death notification.", "3. All fields must be filled.", "4. The previous person dies when you record the next.", "5. Click agree if you understand."],
    jp: ["1. 名前と時間を正確に入力してください。", "2. チェックボックスで死亡通知が表示されます。", "3. 空欄がある場合は登録できません。", "4. 次の名前を書くとき、前の人が死亡します。", "5. 同意する場合はボタンを押してください。"],
    ru: ["1. Введите имя и время точно.", "2. Отметьте флажок для уведомления.", "3. Все поля должны быть заполнены.", "4. Предыдущий умирает при следующей записи.", "5. Нажмите Согласен, если поняли."],
    cn: ["1. 请准确输入姓名和时间。", "2. 勾选框以开启死亡通知。", "3. 所有字段必须填写。", "4. 记录下一个名字时，前一个人会死亡。", "5. 如果理解请点击同意。"]
};

const translations = {
    ko: { rulesTitle: "RULES", agree: "동의", alertEmpty: "모든 항목을 입력해주세요!", addButton: "기록하기", deathMessage: (n,t,y,r)=>`▷ ${n}은(는) 사망했습니다. (${y} ${t}, 사유: ${r})`, placeholder: {name:"이름",year:"날짜",time:"시간",reason:"사인"}, effectOption:"사망 알림 효과", inputLabels:["이름:","날짜:","시간:","사인:"] },
    en: { rulesTitle: "RULES", agree: "AGREE", alertEmpty: "Please fill all fields!", addButton: "Record", deathMessage: (n,t,y,r)=>`▷ ${n} has died. (${y} ${t}, Cause: ${r})`, placeholder: {name:"Name",year:"Date",time:"Time",reason:"Reason"}, effectOption:"Death Effect", inputLabels:["Name:","Date:","Time:","Reason:"] },
    jp: { rulesTitle: "ルール", agree: "同意", alertEmpty: "入力してください！", addButton: "記録", deathMessage: (n,t,y,r)=>`▷ ${n}は死亡した。(${y} ${t}, 理由: ${r})`, placeholder: {name:"名前",year:"年月日",time:"時間",reason:"理由"}, effectOption:"死亡通知", inputLabels:["名前:","日付:","시간:","理由:"] },
    ru: { rulesTitle: "ПРАВИЛА", agree: "СОГЛАСЕН", alertEmpty: "Заполните поля!", addButton: "Записать", deathMessage: (n,t,y,r)=>`▷ ${n} умер. (${y} ${t}, причина: ${r})`, placeholder: {name:"Имя",year:"Дата",time:"Время",reason:"Причина"}, effectOption:"Эффект", inputLabels:["Имя:","Дата:","Время:","Причина:"] },
    cn: { rulesTitle: "规则", agree: "同意", alertEmpty: "请填写字段！", addButton: "添加", deathMessage: (n,t,y,r)=>`▷ ${n}死亡了。(${y} ${t}, 原因: ${r})`, placeholder: {name:"姓名",year:"日期",time:"时间",reason:"原因"}, effectOption:"死亡提示", inputLabels:["姓名:","日期:","时间:","原因:"] }
};

let currentLang = "ko";
let lastVictim = null; // 이전 사망자 정보를 저장할 변수

const deathNote = document.getElementById("deathNote");
const rulesOverlay = document.getElementById("rulesOverlay");
const leftCurtain = document.getElementById("leftCurtain");
const rightCurtain = document.getElementById("rightCurtain");
const rulesWrapper = document.getElementById("rulesWrapper");
const mainWrapper = document.getElementById("mainWrapper");

function updateUI(){
    const t = translations[currentLang];
    document.getElementById("rulesMainTitle").textContent = t.rulesTitle;
    document.getElementById("agreeBtn").textContent = t.agree;
    document.getElementById("rulesContent").innerHTML = rulesText[currentLang].map(p=>`<p>${p}</p>`).join("");
    document.getElementById("name").placeholder = t.placeholder.name;
    document.getElementById("year").placeholder = t.placeholder.year;
    document.getElementById("time").placeholder = t.placeholder.time;
    document.getElementById("reason").placeholder = t.placeholder.reason;
    document.getElementById("effectText").textContent = t.effectOption;
    document.getElementById("recordBtn").textContent = t.addButton;
}

// 모드 전환
document.getElementById("deviceSelect").addEventListener("change", (e) => {
    mainWrapper.style.width = (e.target.value === "mobile") ? "375px" : "100%";
});

document.getElementById("langSelect").addEventListener("change", (e)=>{
    currentLang = e.target.value;
    updateUI();
});

// 커튼 애니메이션
document.getElementById("agreeBtn").addEventListener("click", ()=>{
    rulesWrapper.style.opacity = "0";
    setTimeout(() => {
        rulesWrapper.style.display = "none";
        leftCurtain.style.transform = "translateX(-100%)";
        rightCurtain.style.transform = "translateX(100%)";
        setTimeout(() => {
            rulesOverlay.style.display = "none";
            deathNote.style.display = "block";
        }, 800);
    }, 300);
});

document.getElementById("viewRulesBtn").addEventListener("click", () => {
    rulesOverlay.style.display = "flex";
    setTimeout(() => {
        leftCurtain.style.transform = "translateX(0)";
        rightCurtain.style.transform = "translateX(0)";
        setTimeout(() => { rulesWrapper.style.display = "block"; rulesWrapper.style.opacity = "1"; }, 800);
    }, 10);
});

document.getElementById("recordBtn").addEventListener("click", ()=>{
    const name=document.getElementById("name").value.trim();
    const year=document.getElementById("year").value.trim();
    const time=document.getElementById("time").value.trim();
    const reason=document.getElementById("reason").value.trim();
    const effect=document.getElementById("effectOption").checked;
    const t = translations[currentLang];

    if(!name || !year || !time || !reason){ alert(t.alertEmpty); return; }

    // 1. 이전 사람 사망 메시지 출력 (새로운 입력이 들어왔을 때 실행)
    if(lastVictim && effect) {
        const msgContainer = document.getElementById("msgContainer");
        msgContainer.innerHTML = ""; // 기존 메시지 비우기
        const msg = document.createElement("div");
        msg.className = "death-message";
        msg.textContent = t.deathMessage(lastVictim.name, lastVictim.time, lastVictim.year, lastVictim.reason);
        msgContainer.appendChild(msg);
    }

    // 2. 현재 사람 리스트에 추가
    const li = document.createElement("li");
    li.innerHTML = `<div><b>${t.inputLabels[0]}</b> ${name} | <b>${t.inputLabels[3]}</b> ${reason}</div>`;
    document.getElementById("list").prepend(li);

    // 3. 현재 입력된 정보를 '이전 사망자'로 저장
    lastVictim = { name, year, time, reason };

    // 입력창 초기화
    ["name","year","time","reason"].forEach(id => document.getElementById(id).value="");
});

updateUI();
</script>
</body>
</html>
